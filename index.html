<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F7A100">
<meta name="robots" content="noindex,nofollow">
<title>Funda Frank</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:ital,wght@0,400;0,500;0,600;0,700;1,700&display=swap">
<style>
:root{
  --or:#F7A100; --or-d:#E08F00; --blauw:#0071B3; --blauw-d:#005A8F; --ink:#1A1A1A; --tekst:#333; --grijs:#666; --licht:#999;
  --lijn:#E6E6E6; --vlak:#F7F7F7; --wit:#fff; --hero1:#E9F4FB; --groen:#1D9B3D; --rood:#D0021B; --info:#EAF4FB;
  --top:#1B7447; --sterk:#0071B3; --kans:#B8730A; --zwak:#777;
  --font:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; --r:6px;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:var(--font);color:var(--tekst);background:var(--wit);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
a{color:var(--blauw);text-decoration:none}
a:hover{text-decoration:underline}
button,input,select{font:inherit;color:inherit}
img{display:block}
[hidden]{display:none!important}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px}

/* Kopbalk in Funda-oranje */
.top{background:var(--or);color:#fff;position:sticky;top:0;z-index:20;padding-top:env(safe-area-inset-top,0px)}
.top .wrap{display:flex;align-items:center;gap:22px;height:52px}
.logo{display:flex;align-items:center;gap:8px;color:#fff;font-weight:700;text-decoration:none}
.logo:hover{text-decoration:none}
.logo .f{background:#fff;color:var(--or);font-style:italic;font-weight:800;font-size:19px;letter-spacing:-.02em;padding:2px 9px 4px;border-radius:4px;transform:skewX(-6deg);display:inline-block;line-height:1.1}
.logo .fr{font-size:18px;font-weight:700;letter-spacing:.01em}
.nav{display:flex;gap:18px;font-size:14px;font-weight:600}
.nav a{color:#fff;opacity:.95;padding:6px 0;border-bottom:2px solid transparent}
.nav a:hover{text-decoration:none;opacity:1}
.nav a.aan{border-bottom-color:#fff}
.nav a b{background:rgba(255,255,255,.25);border-radius:999px;padding:0 6px;font-size:12px;margin-left:4px}
.rechts{margin-left:auto;display:flex;gap:16px;font-size:14px;font-weight:600;align-items:center}
.rechts a{color:#fff;display:flex;align-items:center;gap:5px}
.rechts a:hover{text-decoration:none}
.ico{width:18px;height:18px;flex:none}
@media (max-width:720px){ .nav{display:none} .rechts .tekst{display:none} }

/* Mobiele tabbalk onderaan */
.tabbalk{display:none;position:fixed;left:0;right:0;bottom:0;z-index:20;background:#fff;border-top:1px solid var(--lijn);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabbalk a{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 0 6px;font-size:11px;font-weight:600;color:var(--grijs)}
.tabbalk a.aan{color:var(--or)}
.tabbalk a:hover{text-decoration:none}
.tabbalk .ico{width:22px;height:22px}
@media (max-width:720px){ .tabbalk{display:flex} body{padding-bottom:64px} }

/* Startpagina */
.hero{background:linear-gradient(180deg,var(--hero1) 0%,#fff 100%);padding:28px 0 8px}
.hero .wrap{max-width:720px}
.hero h1{font-size:26px;font-weight:700;color:var(--ink);margin:0 0 4px;text-align:center}
.hero p{text-align:center;color:var(--grijs);margin:0 0 18px;font-size:14.5px}
.zoekkaart{background:#fff;border:1px solid var(--lijn);border-radius:10px;box-shadow:0 6px 24px rgba(0,0,0,.06);padding:0 20px 20px}
.ztabs{display:flex;justify-content:center;gap:4px;border-bottom:1px solid var(--lijn);margin-bottom:18px}
.ztabs a{padding:14px 16px 11px;font-size:14px;font-weight:600;color:var(--grijs);border-bottom:3px solid transparent}
.ztabs a.aan{color:var(--ink);border-bottom-color:var(--or)}
.ztabs a:hover{text-decoration:none;color:var(--ink)}
.zoekrij{display:flex;gap:10px;align-items:center}
.zoekveld{flex:1;display:flex;border:1px solid #CFCFCF;border-radius:6px;overflow:hidden}
.zoekveld input{flex:1;border:0;padding:11px 14px;font-size:15px;min-width:0;outline:none}
.zoekveld button{border:0;background:var(--or);color:#fff;width:46px;cursor:pointer;display:grid;place-items:center}
.zoekrij .kaartlink{white-space:nowrap;font-weight:600;font-size:14px;display:flex;gap:6px;align-items:center}
@media (max-width:560px){ .zoekrij{flex-wrap:wrap} .zoekrij .kaartlink{width:100%;justify-content:center} }
.tegels{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin:22px 0 6px}
.tegel{border:1px solid var(--lijn);border-radius:8px;padding:14px 16px;display:flex;align-items:center;gap:12px;font-weight:600;font-size:14.5px;color:var(--blauw);background:#fff}
.tegel .ico{width:30px;height:30px;color:var(--or)}
.tegel:hover{text-decoration:none;border-color:#cfcfcf}
.tegel small{display:block;font-weight:400;color:var(--grijs);font-size:12.5px}
@media (max-width:720px){ .tegels{grid-template-columns:1fr;gap:10px} }
h2.sectie{font-size:22px;font-weight:700;color:var(--ink);margin:34px 0 14px}
h2.sectie small{font-size:14px;font-weight:400;color:var(--grijs);margin-left:10px}
.beeldgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
@media (max-width:900px){ .beeldgrid{grid-template-columns:repeat(2,1fr)} }
@media (max-width:560px){ .beeldgrid{grid-template-columns:1fr} }
.bkaart{border:1px solid var(--lijn);border-radius:8px;overflow:hidden;background:#fff;color:var(--tekst);display:block;position:relative}
.bkaart:hover{text-decoration:none;box-shadow:0 4px 16px rgba(0,0,0,.08)}
.bkaart .foto{aspect-ratio:3/2;background:var(--vlak);position:relative;overflow:hidden}
.bkaart .foto img{width:100%;height:100%;object-fit:cover}
.bkaart .inh{padding:12px 14px 14px}
.bkaart .prijs{font-weight:700;font-size:17px;color:var(--ink)}
.bkaart .adr{color:var(--blauw);font-weight:600;margin-top:2px}
.bkaart .pl{color:var(--grijs);font-size:13.5px}
.bkaart .spec{color:var(--grijs);font-size:13px;margin-top:6px}

/* Score-chip en labels op foto's */
.chip{position:absolute;left:10px;top:10px;background:var(--b,#333);color:#fff;font-weight:700;font-size:15px;padding:4px 9px;border-radius:6px;display:flex;align-items:baseline;gap:5px;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.chip small{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;opacity:.95}
.chip.voorlopig{background:rgba(30,30,30,.72);border:1.5px dashed rgba(255,255,255,.8)}
.b-top{--b:var(--top)} .b-sterk{--b:var(--sterk)} .b-kans{--b:var(--kans)} .b-zwak{--b:var(--zwak)}
.hart{position:absolute;right:10px;top:10px;width:34px;height:34px;border-radius:50%;background:#fff;border:1px solid var(--lijn);display:grid;place-items:center;cursor:pointer;color:var(--blauw);padding:0}
.hart[aria-pressed="true"]{color:var(--rood)}
.hart .ico{width:18px;height:18px}
.etiket{position:absolute;left:10px;bottom:10px;display:flex;gap:5px;flex-wrap:wrap}
.etiket span{background:#fff;color:var(--ink);font-size:11.5px;font-weight:700;padding:3px 7px;border-radius:4px;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.etiket .nieuw{background:var(--or);color:#fff}
.etiket .bod{background:#FFF1DB;color:#8A4510}
.etiket .daal{background:#DFF3E6;color:var(--top)}
.etiket .weg{background:#444;color:#fff}

/* Zoekresultaten */
.resultaten{display:grid;grid-template-columns:270px minmax(0,1fr);gap:26px;padding:22px 0 40px;align-items:start}
@media (max-width:900px){ .resultaten{grid-template-columns:1fr;gap:12px;padding-top:12px} }
.filters{border:1px solid var(--lijn);border-radius:8px;padding:16px;position:sticky;top:64px;background:#fff}
.filters h3{margin:0 0 10px;font-size:15px;color:var(--ink)}
.filters .blok{border-top:1px solid var(--lijn);padding:12px 0}
.filters .blok:last-child{padding-bottom:0}
.filters label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--grijs)}
.filters label b{color:var(--ink);font-weight:600;font-size:13.5px}
.filters input[type=range]{width:100%;accent-color:var(--or)}
.filters select,.filters input[type=search]{width:100%;border:1px solid #CFCFCF;border-radius:6px;padding:8px 10px;background:#fff}
.keuze{display:flex;flex-direction:column;gap:6px}
.keuze label{flex-direction:row;align-items:center;gap:8px;color:var(--tekst);font-size:14px;cursor:pointer}
.keuze input{accent-color:var(--or);width:16px;height:16px}
.filterknop{display:none;border:1px solid #CFCFCF;background:#fff;border-radius:6px;padding:9px 14px;font-weight:600;cursor:pointer;align-items:center;gap:8px}
@media (max-width:900px){ .filterknop{display:inline-flex} .filters{display:none;position:static} .filters.open{display:block} }
.lijstkop{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.lijstkop h1{font-size:20px;margin:0;color:var(--ink)}
.lijstkop h1 small{font-weight:400;color:var(--grijs);font-size:14px;margin-left:8px}
.sorteer{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--grijs)}
.sorteer select{border:1px solid #CFCFCF;border-radius:6px;padding:7px 10px;background:#fff;font-weight:600;color:var(--ink)}
.lijst{display:flex;flex-direction:column;gap:14px}
.rkaart{border:1px solid var(--lijn);border-radius:8px;background:#fff;display:grid;grid-template-columns:300px minmax(0,1fr);overflow:hidden}
.rkaart:hover{box-shadow:0 4px 18px rgba(0,0,0,.08)}
.rkaart .foto{position:relative;background:var(--vlak);aspect-ratio:3/2;overflow:hidden}
.rkaart .foto img{width:100%;height:100%;object-fit:cover}
.rkaart .inh{padding:14px 18px 14px;display:flex;flex-direction:column;gap:5px;min-width:0}
.rkaart .adr{font-size:18px;font-weight:700;color:var(--blauw);line-height:1.2}
.rkaart .pl{color:var(--grijs);font-size:13.5px}
.rkaart .prijs{font-size:18px;font-weight:700;color:var(--ink);margin-top:2px}
.rkaart .prijs s{font-weight:400;font-size:13px;color:var(--licht);margin-left:8px}
.rkaart .prijs small{font-weight:400;font-size:13px;color:var(--grijs)}
.specs{display:flex;flex-wrap:wrap;gap:4px 14px;color:var(--tekst);font-size:14px;align-items:center}
.specs span{display:inline-flex;align-items:center;gap:5px}
.specs .ico{width:16px;height:16px;color:var(--grijs)}
.lbl{display:inline-block;color:#fff;font-weight:700;font-size:12px;padding:1px 7px;border-radius:3px;background:#777;line-height:1.5}
.lbl.A,.lbl.Ap{background:#1D9B3D} .lbl.B{background:#5BBF3A} .lbl.C{background:#C9D400;color:#333} .lbl.D{background:#F2C000;color:#333} .lbl.E{background:#F39200} .lbl.F{background:#E8501B} .lbl.G{background:#D0021B}
.rkaart .sam{color:var(--tekst);font-size:14px;margin:2px 0 0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.rkaart .mak{color:var(--grijs);font-size:13px;margin-top:auto;padding-top:6px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center}
.rkaart .acties{display:flex;gap:8px;flex-wrap:wrap}
.knop{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid #CFCFCF;background:#fff;border-radius:6px;padding:8px 14px;font-size:14px;font-weight:600;color:var(--blauw);cursor:pointer;text-decoration:none;white-space:nowrap}
.knop:hover{text-decoration:none;background:var(--vlak)}
.knop.oranje{background:var(--or);border-color:var(--or);color:#fff}
.knop.oranje:hover{background:var(--or-d)}
.knop.klein{padding:5px 10px;font-size:13px}
.knop[aria-pressed="true"]{border-color:var(--rood);color:var(--rood);background:#FFF3F3}
.knop .ico{width:16px;height:16px}
@media (max-width:720px){ .rkaart{grid-template-columns:1fr} .rkaart .inh{padding:12px 14px 14px} }
.meer{align-self:center;margin-top:8px}
.leeg{border:1px dashed var(--lijn);border-radius:8px;padding:30px;text-align:center;color:var(--grijs)}
.uitleg{color:var(--grijs);font-size:13.5px;margin:0 0 12px}

/* Detailpagina */
.kruimel{display:flex;gap:6px;font-size:13px;color:var(--grijs);padding:12px 0 10px;flex-wrap:wrap;align-items:center}
.kruimel .ico{width:14px;height:14px}
.galerij{display:grid;grid-template-columns:2fr 1fr 1fr;grid-template-rows:1fr 1fr;gap:4px;border-radius:8px;overflow:hidden;aspect-ratio:2.6/1;background:var(--vlak)}
.galerij .g{position:relative;overflow:hidden;background:var(--vlak);cursor:pointer;border:0;padding:0}
.galerij .g:first-child{grid-row:1/3}
.galerij .g img{width:100%;height:100%;object-fit:cover}
.galerij .g.lucht img.ov{position:absolute;inset:0}
.galerij .g .bijschrift{position:absolute;left:8px;bottom:8px;background:rgba(0,0,0,.6);color:#fff;font-size:12px;padding:2px 7px;border-radius:4px}
.galerij .g .speld{position:absolute;left:50%;top:50%;width:12px;height:12px;margin:-6px 0 0 -6px;border-radius:50%;background:#E5484D;border:2.5px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.3)}
.galerij .g .meerfotos{position:absolute;inset:0;background:rgba(0,0,0,.45);color:#fff;display:grid;place-items:center;font-weight:700;font-size:18px}
.galerij-wrap .knopbalk{position:absolute;right:12px;top:12px;display:flex;gap:8px}
.galerij-wrap{position:relative}
@media (max-width:720px){
  .galerij{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;aspect-ratio:3/2;border-radius:0;margin:0 -16px;scrollbar-width:none;gap:0}
  .galerij::-webkit-scrollbar{display:none}
  .galerij .g{flex:0 0 100%;scroll-snap-align:start}
  .galerij .g .meerfotos{display:none}
}
.mediabalk{display:flex;gap:22px;padding:12px 0;border-bottom:1px solid var(--lijn);font-size:14px;font-weight:600;flex-wrap:wrap}
.mediabalk a,.mediabalk button{display:flex;align-items:center;gap:6px;color:var(--blauw);background:none;border:0;padding:0;cursor:pointer;font-weight:600}
.mediabalk .ico{width:18px;height:18px}
.detail{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:40px;padding:22px 0 50px;align-items:start}
@media (max-width:900px){ .detail{grid-template-columns:1fr;gap:20px} }
.detail h1{font-size:28px;margin:0;color:var(--ink);line-height:1.15}
.detail .pl{color:var(--grijs);font-size:14.5px;margin-top:3px}
.detail .prijs{font-size:20px;font-weight:700;color:var(--ink);margin:12px 0 4px}
.detail .prijs small{font-weight:400;font-size:14px;color:var(--grijs)}
.detail .prijs s{font-weight:400;font-size:14px;color:var(--licht);margin-left:8px}
.detail .specs{margin:8px 0 14px}
.infobox{background:var(--info);border-radius:6px;padding:10px 14px;font-size:14.5px;color:var(--ink);margin:10px 0 20px}
.detail h2{font-size:20px;color:var(--ink);margin:26px 0 10px}
.kort{display:flex;flex-direction:column;gap:12px;margin:0;padding:0;list-style:none}
.kort li{display:flex;gap:12px;align-items:flex-start;padding-bottom:12px;border-bottom:1px solid var(--lijn)}
.kort .ik{width:34px;height:34px;border-radius:6px;background:var(--info);display:grid;place-items:center;flex:none;color:var(--blauw)}
.kort li.min .ik{background:#FFF1DB;color:#B8730A}
.kort li.min.e3 .ik,.kort li.min.e2 .ik{background:#FBE7E6;color:var(--rood)}
.kort .ik .ico{width:18px;height:18px}
.kort b{display:block;color:var(--ink);font-weight:600}
.kort span{color:var(--grijs);font-size:13.5px}
.aibadge{display:flex;align-items:center;gap:6px;color:var(--grijs);font-size:13px;margin:-4px 0 12px}
.aibadge .ico{width:16px;height:16px;color:var(--groen)}
.kenm{border:1px solid var(--lijn);border-radius:8px;padding:4px 16px 6px;margin-bottom:14px}
.kenm h3{display:flex;align-items:center;gap:8px;font-size:15px;margin:10px 0 4px;color:var(--ink)}
.kenm h3 .ico{width:18px;height:18px;color:var(--grijs)}
.kenm dl{margin:0;display:grid;grid-template-columns:minmax(140px,38%) 1fr;gap:0 12px}
.kenm dt{color:var(--grijs);font-size:14px;padding:7px 0;border-top:1px solid var(--lijn)}
.kenm dd{margin:0;font-size:14px;padding:7px 0;border-top:1px solid var(--lijn);color:var(--ink)}
.zij{position:sticky;top:66px;display:flex;flex-direction:column;gap:14px}
@media (max-width:900px){ .zij{position:static} }
.scorekaart{border:1px solid var(--lijn);border-radius:8px;padding:16px 18px}
.scorekaart .kopje{display:flex;align-items:center;gap:14px}
.scorekaart .getal{width:64px;height:64px;border-radius:10px;background:var(--b);color:#fff;font-size:30px;font-weight:700;display:grid;place-items:center;flex:none}
.scorekaart .getal.voorlopig{background:#fff;color:var(--b);border:2px dashed var(--b)}
.scorekaart .band{font-weight:700;color:var(--b);font-size:16px}
.scorekaart .sub{color:var(--grijs);font-size:13px}
.balken{display:flex;flex-direction:column;gap:7px;margin-top:14px}
.balk{display:grid;grid-template-columns:92px 1fr 44px;gap:8px;align-items:center;font-size:13px;color:var(--grijs)}
.balk i{height:7px;border-radius:4px;background:var(--vlak);position:relative;display:block;overflow:hidden}
.balk i u{position:absolute;inset:0 auto 0 0;background:var(--b);border-radius:4px}
.balk em{font-style:normal;text-align:right;color:var(--ink);font-variant-numeric:tabular-nums}
.balk.malus em{color:var(--rood)}
.actiekaart{border:1px solid var(--lijn);border-radius:8px;padding:16px 18px;display:flex;flex-direction:column;gap:10px}
.actiekaart .knop{width:100%;padding:12px 14px;font-size:15px}
.actiekaart .rij{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.actiekaart .rij .knop{padding:9px 6px;font-size:13px}
.actiekaart .mak{text-align:center;color:var(--grijs);font-size:13px;margin-top:4px}
.notitie{width:100%;border:1px solid #CFCFCF;border-radius:6px;padding:9px 11px;font-size:14px}
.ligging{position:relative;border-radius:8px;overflow:hidden;aspect-ratio:3/2;background:var(--vlak)}
.ligging img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.ligging .speld{position:absolute;left:50%;top:50%;width:14px;height:14px;margin:-7px 0 0 -7px;border-radius:50%;background:#E5484D;border:3px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.3)}
.ligging .bijschrift{position:absolute;left:10px;bottom:10px;background:rgba(0,0,0,.6);color:#fff;font-size:12px;padding:3px 8px;border-radius:4px}
.ligging-links{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}
.voet{border-top:1px solid var(--lijn);color:var(--grijs);font-size:12.5px;padding:18px 0 26px;text-align:center}
.lightbox{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px}
.lightbox img{max-width:96vw;max-height:84vh;object-fit:contain}
.lightbox .lb-knoppen{display:flex;gap:10px;color:#fff;align-items:center}
.lightbox button{background:rgba(255,255,255,.15);color:#fff;border:0;border-radius:6px;padding:8px 14px;cursor:pointer;font-weight:600}
.lightbox .sluit{position:absolute;right:14px;top:14px}
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <a class="logo" href="#/"><span class="f">funda</span><span class="fr">Frank</span></a>
    <nav class="nav" id="nav"></nav>
    <div class="rechts">
